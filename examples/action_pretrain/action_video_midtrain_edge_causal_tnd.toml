# Cosmos3-Edge robot-action / human-video co-training with synchronized task steps.
# 公共模板、geometry 和训练参数放在此处。
# 来源路径、读取规则、统计文件及采样权重放在 sources/*.json。

[job]
task                      = "vfm"
experiment                = "action_video_midtrain_edge"
project                   = "cosmos3_action"
group                     = "midtrain"
name                      = "action_video_midtrain_edge"
wandb_mode                = "disabled"
upload_reproducible_setup = false

[action]
# 公共模板与时序配置；来源差异单独放在 sources/*.json。
template = "cosmos_framework.data.generator.action.action_state_template.ActionStateTemplate55"
# 来源默认使用 pyav_resize；在 sources JSON 中显式设置 video_backend="pyav" 可回退。
sources_file = "${oc.env:ACTION_SOURCES_FILE}"
# 表格后端：parquet 直接读取、不写 Arrow 缓存且无文件 LRU；hf 使用旧磁盘缓存。
# sources JSON 中同名字段可覆盖此默认值；不影响视频解码后端。
table_backend = "parquet"
# 在读取时抽取视频帧；false 恢复拼接后抽帧，便于内存对照。
early_video_sampling = true
# 开局缺少的过去画面重复episode首帧；缺失的真实中间观测仍报错。
history_padding = "repeat_first"
# P：下采样前的历史控制步数。30Hz时1024步约34.1秒；stride4后
# 有257张观测RGB，经VAE时间压缩4倍成为65个latent（均含当前观测）。
history_steps = 1024
# H：当前时刻之后的动作预测长度；仅H行action和1行当前state，无历史占位。
# P和H独立，只需分别对齐stride4×VAE4=16，不要求P能被H整除。
action_horizon = 32
# 每4个控制步采样1张RGB，动作仍保持原始控制频率。
video_stride = 4
# IO segment 最多896步；repeat_first从真实episode读取1024步历史及32步目标。
max_action_steps = 896
overlap_action_steps = 161
resolution = "480"
mode = "joint"
seed = 42
allow_mock_statistics = false

[human_video]
# LeRobot root/parent directory or a JSONL manifest; only video and captions are read.
dataset_path = "${oc.env:HUMAN_VIDEO_DATASET_PATH}"
# Ratios are training-step weights. Set either ratio to zero for a single-task run.
robot_ratio = 1
video_ratio = 1

[model]
# Embed action/state validity masks; false disables input mask embeddings only.
add_action_flag = false
# 开启后单独记录 rank 0 的 Policy / ID / FD loss；关闭时跳过新增统计。
causal_action_log_loss_by_mode      = false
precision                           = "bfloat16"
max_num_tokens_after_packing        = -1
# 机器人使用单次decision_window；视频-only仍可独立采用原AR teacher forcing。
joint_attn_implementation           = "teacher_forcing"
causal_training_strategy            = "teacher_forcing"
teacher_forcing_dense_mode          = "grouped_tnd"
teacher_forcing_tnd_max_kv_tokens   = 131072
teacher_forcing_visualize_sdpa_mask = false

# Action mid-training updates newly initialized action/state interfaces, so the
# recipe uses live weights instead of maintaining a second EMA parameter copy.
[model.ema]
enabled = false

[model.parallelism]
data_parallel_shard_degree     = -1
data_parallel_replicate_degree = 1
context_parallel_shard_degree  = 1
cfg_parallel_shard_degree      = 1
fsdp_mixed_precision_enabled   = true
fsdp_master_dtype              = "float32"

[model.compile]
enabled         = false
compile_dynamic = true

[model.activation_checkpointing]
mode               = "full"
save_ops_regex     = ["fmha"]
preserve_rng_state = true
determinism_check  = "default"

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
betas          = [0.9, 0.99]
eps            = 1.0e-8
fused          = true
keys_to_select = [
    "moe_gen",
    "time_embedder",
    "vae2llm",
    "llm2vae",
    "state2llm",
    "state_modality_embed",
    "state_mask_embed",
    "action2llm",
    "llm2action",
    "action_modality_embed",
    "action_mask_embed",
    "k_norm_und_for_gen",
]
lr               = 5.0e-5
lr_multipliers   = {}
optimizer_type   = "AdamW"
weight_decay     = 0.05

# 沿用昨晚实验快照的学习率衰减配置。
[scheduler]
lr_scheduler_type = "LambdaLinear"
cycle_lengths      = [10000]
f_max              = [1.0]
f_min              = [0.3]
f_start            = [1.0]
verbosity_interval = 0
warm_up_steps      = [0]

[trainer]
distributed_parallelism = "fsdp"
grad_accum_iter         = 1
logging_iter            = 1
max_iter                = 10000

[trainer.callbacks.compile_tokenizer]
compile_after_iterations = 3
enabled                  = false

[trainer.callbacks.grad_clip]
clip_norm    = 1.0
force_finite = true

# Warm-start the shared video backbone while leaving the action/state adapters
# freshly initialized. Resuming a checkpoint from this same run restores them
# through the experiment's normal DCP resume path.
[checkpoint]
keys_to_skip_loading = [
    "net_ema.",
    "state2llm",
    "state_modality_embed",
    "state_mask_embed",
    "action2llm",
    "llm2action",
    "action_modality_embed",
    "action_mask_embed",
    "action_pos_embed",
]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 5000

[dataloader_train]
max_sequence_length = 65536
num_workers          = 4
